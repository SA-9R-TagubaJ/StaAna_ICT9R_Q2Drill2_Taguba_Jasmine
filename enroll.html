<div class="container-fluid mt-3">


 <div class="container-fluid mt-3 bg-light text-dark">
   <h3> Enroll Form </h3>
 </div>


<form class="enroll-form">
        <div>
            <label for="name">Childs name:</label>
            <input type="text" id="name"
                   name="name" required><br>


            <label for="email">Guardians Email:</label>
            <input type="email" id="email"
                   name="email" required><br>


            <label for="phone">Guardians Phone Number:</label>
            <input type="tel" id="phone"  
                   name="phone" required><br>
        </div><br>




        <div>
            <label for="age">Age:</label>
            <input type="number" id="age"
                   name="age" min="1" max="100" required>
        </div><br>


        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob"
                   name="dob" required>
        </div><br>  


        <div>
            <label class="gender">Gender:


                <label for="male">Male
                    <input type="radio" id="male"
                           name="gender" value="male" checked>
                </label>
                <label for="female">Female
                    <input type="radio" id="female"
                           name="gender" value="female">
                </label>
                <label for="other">Other
                    <input type="radio" id="other"
                           name="gender" value="other">
                </label>
               <br>
            </label>
<br>
        <div>
            <label for="comments">About your child:</label><br>
            <textarea id="comments" name="comments" rows="4">
              </textarea>




        </div><br>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>


</body>
